[project]
name = "quehun"
version = "2.0.0"
description = "雀魂AI助手 - 自动识别麻将画面，接入大模型提供实时出牌建议"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2.0"]
torch = ["torch>=2.0", "torchvision>=0.15"]
capture = ["mss>=9.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["quehun[yolo,torch,capture,dev]"]

[project.scripts]
quehun-calibrate = "tools.calibrate:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
